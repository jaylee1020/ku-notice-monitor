name: 건국대 공지 모니터링

on:
  schedule:
    # 매시간 확인: 긴급 공지는 즉시, 일반 공지는 설정 시각에 요약.
    # 정각(0분) 예약은 GitHub 부하로 자주 누락되어 하루 6~7회만 실행되었으므로
    # 붐비지 않는 분에 실행한다. 그래도 하루 4~6회만 실행되어, 외부 스케줄러가 매시간
    # workflow_dispatch를 호출하고 이 예약은 예비로 둔다(docs/external-trigger.md).
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: ku-notice-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 네트워크 행(hang) 시 기본 6시간 동안 러너가 잡혀 있는 것을 방지
    permissions:
      contents: read
    outputs:
      state_uploaded: ${{ steps.upload_state.outcome == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.29'
          enable-cache: true

      - name: Load runtime state
        run: |
          # 네트워크 오류를 "상태 없음"으로 오인하면 최초 실행처럼 공지를 시드해 버리므로,
          # 브랜치가 실제로 없을 때(exit 2)만 새 상태로 시작한다.
          rm -f state.json
          status=0
          git ls-remote --exit-code --heads origin monitor-state > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            # 상태 브랜치는 매시간 커밋이 쌓이므로 최신 커밋 하나만 받는다.
            git fetch --no-tags --depth=1 origin refs/heads/monitor-state:refs/remotes/origin/monitor-state
            git show origin/monitor-state:state.json > state.json
          elif [ "$status" -eq 2 ]; then
            echo "monitor-state 브랜치가 없어 최초 실행으로 시작합니다."
          else
            echo "::error::monitor-state 브랜치를 확인하지 못했습니다 (exit $status)."
            exit 1
          fi

      - name: Install locked dependencies
        run: uv sync --locked --python '3.12'

      - name: Run monitor
        id: monitor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROFILE_TEXT: ${{ secrets.PROFILE_TEXT }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
          KEYWORDS_JSON: ${{ secrets.KEYWORDS_JSON }}
        run: uv run --no-sync ku-notice-monitor

      # 상태는 전송 한 건마다 원자적으로 저장되므로 실행이 중간에 실패해도 일관적이다.
      # 실패한 실행의 상태도 보존해야 이미 보낸 알림을 다음 실행에서 다시 보내지 않는다.
      - name: Upload runtime state
        id: upload_state
        if: always() && hashFiles('state.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-state
          path: state.json
          retention-days: 1
          if-no-files-found: error

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 모니터가 이미 원인과 로그 링크를 담아 알렸다면 같은 실패를 다시 알리지 않는다.
          # 이 단계는 설치 실패처럼 모니터가 실행되기 전에 난 오류만 알린다.
          if [ -f .error-notified ]; then
            echo "모니터가 이미 오류를 알렸습니다."
            exit 0
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl --silent --show-error --fail \
              --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "link_preview_options={\"is_disabled\":true}" \
              --data-urlencode "text=[모니터링 오류] 공지 모니터를 실행하지 못했습니다
          공지 분석 전 단계(설치·상태 불러오기 등)에서 실패했습니다.
          로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

  persist-state:
    needs: monitor
    if: always() && needs.monitor.outputs.state_uploaded == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download runtime state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: runtime-state
          path: runtime-state

      - name: Commit state to dedicated branch
        run: |
          # 전체 이력 대신 상태 브랜치의 최신 커밋만 받아 그 위에 커밋한다.
          status=0
          git ls-remote --exit-code --heads origin monitor-state > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --no-tags --depth=1 origin refs/heads/monitor-state:refs/remotes/origin/monitor-state
            git switch -C monitor-state origin/monitor-state
          elif [ "$status" -eq 2 ]; then
            git switch -c monitor-state
          else
            echo "::error::monitor-state 브랜치를 확인하지 못했습니다 (exit $status)."
            exit 1
          fi
          cp runtime-state/state.json state.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update runtime state [skip ci]"
          git push origin HEAD:monitor-state
