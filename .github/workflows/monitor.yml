name: 건국대 공지 모니터링

on:
  schedule:
    - cron: '0 1 * * *'  # 매일 오전 10시 KST (UTC+9 → UTC 01:00)
  workflow_dispatch:

concurrency:
  group: ku-notice-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 네트워크 행(hang) 시 기본 6시간 동안 러너가 잡혀 있는 것을 방지
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        id: monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
          KEYWORDS_JSON: ${{ secrets.KEYWORDS_JSON }}
        run: python main.py

      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git pull --rebase && git push || (sleep 3 && git pull --rebase && git push)

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-logs
          path: |
            *.log
            state.json
          retention-days: 7

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import asyncio, os
          from notifier import notify_error
          run_url = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          asyncio.run(notify_error(f'GitHub Actions 워크플로우 실패\n로그 확인: {run_url}'))
          "
