# 건국대학교 공지 모니터링 에이전트 설정

# === 사용자 프로필 ===
# 개인정보는 GitHub Secrets에 저장하고 환경변수로 주입합니다.
# 권장 환경변수 PROFILE_TEXT 예시:
#   나는 건국대학교 서울캠퍼스 컴퓨터공학부 2학년이다. 서울특별시에 거주한다.
#   다른 지역 주민 전용 사업은 보내지 말고, 문서에 없는 가족 조건은 추측하지 마라.
# 기존 PROFILE_JSON은 마이그레이션 호환용으로 계속 지원합니다.
# 환경변수 PROFILE_JSON 예시:
#   {"major":"컴퓨터공학부","previous_major":"KU자유전공학부","year":2,"campus":"서울","status":"재학"}
# 환경변수 KEYWORDS_JSON 예시:
#   {"high":["장학","등록금","수강신청"],"medium":["취업","인턴","공모전"]}
#
# 아래는 환경변수가 없을 때 사용되는 기본값입니다.
profile_text: ""

profile:
  major: ""
  previous_major: ""
  year: 0
  campus: ""
  status: ""

keywords:
  high: []
  medium: []

# === RSS 피드 설정 ===
feeds:
  학사공지:
    id: 234
    enabled: true
  장학공지:
    id: 235
    enabled: true
  취창업공지:
    id: 236
    enabled: true
  국제교류:
    id: 237
    enabled: true
  학생생활:
    id: 238
    enabled: true
  입찰공고공지:
    id: 239
    enabled: false
  일반공지:
    id: 240
    enabled: true
  채용공지:
    id: 243
    enabled: true
  학사서식공지:
    id: 247
    enabled: true
  대학일자리플러스:
    id: 4083
    enabled: true
    rss_url: "https://kuinc.konkuk.ac.kr/bbs/job/4083/rssList.do"

# === AI 분석 설정 ===
ai:
  model: "gpt-5.6-luna"
  reasoning_effort: "low"      # 사실 추출에 맞춘 비용/지연 기본값
  max_concurrency: 4           # 공지별 독립 분석 동시 요청 수
  request_timeout_seconds: 45  # 재시도 1회당 전체 요청 제한
  image_detail: "low"          # 공지 이미지 분석 비용 절감
  file_detail: "low"           # PDF 텍스트는 유지하면서 페이지 이미지 비용 절감

# === 전달 결정 정책 ===
classification:
  action_window_days: 21       # 관련 행동 마감이 이 기간 안이면 즉시 알림
  # 프로필에 근거가 없는 선택적 기회를 "혹시 해당될 수 있음"만으로 보내지 않습니다.
  suppress_speculative_opportunities: true

# === 알림 설정 ===
notifications:
  digest_hour_kst: 21          # 일반 공지 일일 요약 시각
  notify_empty_runs: false     # 매시간 "새 공지 없음" 메시지는 보내지 않음

# === 설정 ===
settings:
  state_file: "state.json"
  base_url: "https://www.konkuk.ac.kr"
  rss_url_template: "https://www.konkuk.ac.kr/bbs/konkuk/{board_id}/rssList.do"
  # 공지 본문·첨부에서 발견한 URL은 이 도메인과 그 하위 도메인만 다운로드합니다.
  allowed_download_hosts:
    - "konkuk.ac.kr"
  # SSL 인증서 검증 (보안을 위해 기본 활성화)
  # 건국대 서버 인증서 문제가 있을 경우 false로 변경하세요.
  # ssl_verify가 false인 경우, 매 실행 시 SSL 상태를 자동 점검하고 로그에 기록합니다.
  ssl_verify: true
  # 최초 실행(state.json이 없을 때) 동작.
  # true: 기존 공지를 알림 없이 '확인함'으로 시드 처리하고, 이후 새 공지부터 분석.
  #       과거 공지 수백 건에 대한 대량 알림/크롤링 폭발을 방지합니다.
  # false: 최초 실행에도 모든 공지를 신규로 간주해 분석·알림.
  seed_on_first_run: true
  # 상태 유실이나 피드 구조 변경으로 신규 공지가 폭증할 때 API 호출·알림을 중단합니다.
  max_new_articles_per_run: 60
  min_feed_success_ratio: 0.7
  # RSS 제목/요약이 그대로여도 상세 본문이 바뀔 수 있어 최근 공지를 주기적으로 재확인합니다.
  detail_refresh_interval_hours: 6
  detail_refresh_days: 14
  detail_refresh_max_articles: 30
